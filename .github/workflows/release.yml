name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read version
        id: version
        run: echo "BLINDX_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip \
            python3-gi python3-gi-cairo python3-dasbus \
            libatspi2.0-dev libatk-bridge2.0-dev libgirepository1.0-dev \
            libgtk-3-dev gettext itstool libxml2-dev libxslt1-dev \
            python3-brlapi python3-louis python3-psutil python3-speechd \
            cargo

      - name: Configure meson
        run: meson setup _build -Dmathcat=false

      - name: Build
        run: ninja -C _build

      - name: Install to DESTDIR
        run: |
          DESTDIR=$PWD/_install ninja -C _build install

      - name: Create .deb package
        run: |
          PKG_NAME="blind-x-screen-reader"
          PKG_VERSION="${{ env.BLINDX_VERSION }}"
          ARCH="amd64"

          mkdir -p _deb/DEBIAN

          cat > _deb/DEBIAN/control << EOF
          Package: $PKG_NAME
          Version: $PKG_VERSION
          Section: x11
          Priority: optional
          Architecture: $ARCH
          Maintainer: Blind-X Team
          Depends: python3 (>= 3.10), python3-gi (>= 3.18), python3-dasbus,
           libatspi2.0-0 (>= 2.56.0), libatk-bridge2.0-0 (>= 2.56.0),
           gir1.2-gtk-3.0 (>= 3.24), python3-speechd
          Description: Blind-X Screen Reader
           A free, open source screen reader for the GNOME desktop
           that provides access to the graphical desktop via speech and braille.
          EOF

          cp -r _install/* _deb/

          dpkg-deb --build _deb

          DEB_FILE="${PKG_NAME}_${PKG_VERSION}_${ARCH}.deb"
          mv _deb.deb "$DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> $GITHUB_ENV

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blind-x-deb
          path: ${{ env.DEB_FILE }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.DEB_FILE }}
          generate_release_notes: true
