name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "BLINDX_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          zypper -n install --no-recommends \
            meson ninja python3 python3-pip \
            python3-gobject-devel python3-dasbus \
            at-spi2-core-devel at-spi2-atk-devel \
            gobject-introspection-devel gtk3-devel \
            gettext-tools itstool libxml2-devel libxslt-devel \
            python3-brlapi python3-louis python3-psutil python3-speechd \
            glib2-devel gsettings-desktop-schemas \
            systemd-devel dpkg cargo

      - name: Configure meson
        run: meson setup _build -Dmathcat=false

      - name: Build
        run: ninja -C _build

      - name: Install to DESTDIR
        run: |
          DESTDIR=$PWD/_install ninja -C _build install

      - name: Create .deb package
        run: |
          PKG_NAME="blind-x-screen-reader"
          PKG_VERSION="${{ env.BLINDX_VERSION }}"
          ARCH="amd64"

          mkdir -p _deb/DEBIAN

          cat > _deb/DEBIAN/control << EOF
          Package: $PKG_NAME
          Version: $PKG_VERSION
          Section: x11
          Priority: optional
          Architecture: $ARCH
          Maintainer: Blind-X Team
          Depends: python3 (>= 3.10), python3-gi (>= 3.18), python3-dasbus,
           libatspi2.0-0 (>= 2.56.0), libatk-bridge2.0-0 (>= 2.56.0),
           gir1.2-gtk-3.0 (>= 3.24), python3-speechd
          Description: Blind-X Screen Reader
           A free, open source screen reader for the GNOME desktop
           that provides access to the graphical desktop via speech and braille.
          EOF

          cat > _deb/DEBIAN/postinst << 'PST_EOF'
#!/bin/bash
set -e

case "$1" in
    configure)
        if [ -n "$SUDO_USER" ]; then
            su "$SUDO_USER" -c "
                KEY_PATH='/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/blind-x-toggle/'
                gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:\${KEY_PATH} name 'Toggle Blind-X'
                gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:\${KEY_PATH} command '/usr/bin/blind-x-toggle'
                gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:\${KEY_PATH} binding '<Primary><Alt>n'
                CURRENT=\$(gsettings get org.gnome.settings-daemon.plugins.media-keys custom-keybindings)
                if echo \"\$CURRENT\" | grep -qF \"\$KEY_PATH\"; then
                    true
                else
                    NEW=\$(echo \"\$CURRENT\" | sed \"s|]|, '\$KEY_PATH']|\")
                    gsettings set org.gnome.settings-daemon.plugins.media-keys custom-keybindings \"\$NEW\"
                fi
            "
        fi
        ;;
esac
PST_EOF
          chmod 755 _deb/DEBIAN/postinst

          cp -r _install/* _deb/

          dpkg-deb --build _deb

          DEB_FILE="${PKG_NAME}_${PKG_VERSION}_${ARCH}.deb"
          mv _deb.deb "$DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> $GITHUB_ENV

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blind-x-deb
          path: ${{ env.DEB_FILE }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.DEB_FILE }}
          generate_release_notes: true
